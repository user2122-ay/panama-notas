<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notas Escolares</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>📚 Notas Escolares</h1>
    <p class="subtitle">Registra tus notas y ausencias por materia</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Entrar</button>
      <button class="tab-btn" data-tab="register">Crear cuenta</button>
    </div>

    <form id="login-form" class="tab-content active">
      <label>Email</label>
      <input type="email" id="login-email" required>
      <label>Contraseña</label>
      <input type="password" id="login-password" required>
      <button type="submit" class="btn-primary">Entrar</button>
      <p class="error" id="login-error"></p>
    </form>

    <form id="register-form" class="tab-content">
      <label>Nombre</label>
      <input type="text" id="reg-nombre" required>
      <label>Email</label>
      <input type="email" id="reg-email" required>
      <label>Contraseña</label>
      <input type="password" id="reg-password" required minlength="6">
      <label>Colegio (opcional)</label>
      <input type="text" id="reg-colegio">
      <label>Grado/Sección (opcional)</label>
      <input type="text" id="reg-grado" placeholder="ej. 9no B">
      <button type="submit" class="btn-primary">Crear cuenta</button>
      <p class="error" id="register-error"></p>
    </form>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
